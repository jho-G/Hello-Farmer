services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hello_farmer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmerpass}
      POSTGRES_DB: ${POSTGRES_DB:-hello_farmer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmer} -d ${POSTGRES_DB:-hello_farmer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hello_farmer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hello_farmer_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/cache:/app/cache
      - ./config.yaml:/app/config.yaml
      - ./pyproject.toml:/app/pyproject.toml
      - ./knowledge_base:/app/knowledge_base
      - ./tests:/app/tests
      - ./eval:/app/eval
      - ./scripts:/app/scripts
      - ./workers:/app/workers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hello_farmer_worker
    restart: unless-stopped
    command: ["python", "-m", "arq", "workers.worker.WorkerSettings"]
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./workers:/app/workers
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://backend:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: hello_farmer_asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10020:10000-10020/udp"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show sysinfo"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hello_farmer_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
