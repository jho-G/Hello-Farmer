; Global settings
[global]
type=global
user_agent=HelloFarmer-Asterisk

; Transport UDP for SIP
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.220.14
external_signaling_address=192.168.220.14

; Transport TCP for SIP
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=192.168.220.14
external_signaling_address=192.168.220.14

; ==========================================
; Extension 1001: Test Softphone (Caller 1)
; ==========================================
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1001
aors=1001
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
direct_media=no
timers=no
rtp_timeout=0
rtp_timeout_hold=0

[auth1001]
type=auth
auth_type=userpass
password=FarmerPass1001!
username=1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ==========================================
; Extension 1002: Test Softphone (Caller 2)
; ==========================================
[1002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1002
aors=1002
rewrite_contact=yes
