# Global settings
[global]
type=global
user_agent=HelloFarmer-Asterisk

# Transport UDP for SIP
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

# Transport TCP for SIP
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

# ==========================================
# Extension 1001: Test Softphone (Caller 1)
# ==========================================
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=FarmerPass1001!
username=1001

[1001]
type=aor
max_contacts=2

# ==========================================
# Extension 1002: Test Softphone (Caller 2)
# ==========================================
[1002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
password=FarmerPass1002!
username=1002

[1002]
type=aor
max_contacts=2
