[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-internal]
; Extension 8028: Hello Farmer National Agricultural Voice Line
exten => 8028,1,NoOp(Hello Farmer Call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 ; Generate valid RFC 4122 UUID required by Asterisk app_audiosocket
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,NoOp(Connecting to AudioSocket backend with UUID: ${CALL_UUID})
 same => n,AudioSocket(${CALL_UUID},backend:9092)
 same => n,Hangup()

; Shortcuts to Hello Farmer
exten => 100,1,Goto(from-internal,8028,1)
exten => 1001,1,Goto(from-internal,8028,1)

; Catch-all invalid extensions
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => h,1,NoOp(Call hung up)
