[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-internal]
; Extension 8028: Hello Farmer National Agricultural Voice Line
exten => 8028,1,NoOp(Hello Farmer Call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 ; Launch AudioSocket connection to Python backend on port 9092 with unique channel ID
 same => n,AudioSocket(${UNIQUEID},backend:9092)
 same => n,Hangup()

; Extension 100: Internal shortcut
exten => 100,1,Goto(from-internal,8028,1)

; Catch-all invalid extensions
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => h,1,NoOp(Call hung up)
